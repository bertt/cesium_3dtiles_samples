<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.118.2/Cesium.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.118.2/Widgets/widgets.min.css" rel="stylesheet">
  
    <style>
      html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .toolbar-left {
            display: block;
            position: absolute;
            top: 5px;
            left: 5px;
        }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script type="module">
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwNTRhYzgyZS0yN2Y5LTRkN2UtODFjNC1hYTJkNDhiNTg2OTkiLCJpZCI6NDc4OSwiaWF0IjoxNzc2Njg1OTQ4fQ.FxNc4gNOnmbRNs9K0ZeIXcQHKkIEMpvETJ5uLtz02Vk';
    var viewer = new Cesium.Viewer('cesiumContainer', {
    });
    viewer.scene.debugShowFramesPerSecond = true;


    const tileset = await Cesium.Cesium3DTileset.fromUrl(
      "tileset.json"
    );  
    viewer.scene.primitives.add(tileset);

    tileset.debugShowBoundingVolume = true;
    tileset.debugShowUrl = true;
    tileset.debugShowViewerRequestVolume = true;
    // viewer.scene.globe.depthTestAgainstTerrain = true;
    viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0, -0.5, 0));
    // viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0, -0.1, 1000));
  </script>
</body>
</html>
