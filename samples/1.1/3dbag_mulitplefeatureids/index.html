

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>
  <link href= "https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
    <style>
      html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .toolbar-left {
            display: block;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        #attributePanel {
            display: none;
            position: absolute;
            z-index: 1;
            background: rgba(42, 42, 42, 0.85);
            color: #fff;
            font: 12px/1.4 sans-serif;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            max-width: 320px;
            white-space: pre;
        }

        #featureIdToggle {
            display: block;
            position: absolute;
            z-index: 1;
            top: 5px;
            right: 5px;
            background: rgba(42, 42, 42, 0.85);
            color: #fff;
            font: 13px sans-serif;
            padding: 6px 10px;
            border-radius: 4px;
        }

  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="attributePanel"></div>
  <select id="featureIdToggle">
    <option value="surfaceType">Surface type attributen (_FEATURE_ID_1)</option>
    <option value="">Pand attributen (_FEATURE_ID_0)</option>
  </select>
  <script type="module">
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzZDFhZGJhMi00OWQ2LTQzOGQtOTY2Ni04MmIxOTVjZmMwZjQiLCJpZCI6NDc4OSwiaWF0IjoxNjk4Mzk4MjM2fQ.GBw4d-IZ-VW22FnqX_fCE2zoctdf8wVnVxlpW2aOq5A';
    var viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      requestRenderMode: true,
      // Basemap/ondergrond kaartlaag: OpenStreetMap tiles, werkt zonder geldig Cesium Ion token.
      imageryProvider: new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/"
      }),
   });

  // const terr = await Cesium.CesiumTerrainProvider.fromUrl("https://web3d.basemap.de/cesium/dgm5-mesh/")
  // viewer.terrainProvider=terr;
  viewer.scene.globe.depthTestAgainstTerrain=true;
  viewer.scene.debugShowFramesPerSecond = true
  const normalColor = Cesium.Color.WHITE;
  let currentColor = Cesium.Color.YELLOW;

// 3D Tileset highlighting
const highlighted = {
  feature: undefined,
  originalColor: new Cesium.Color(),
};


// viewer.scene.light = new Cesium.DirectionalLight({
//   direction: viewer.scene.camera.directionWC,
// });
// viewer.scene.preRender.addEventListener(function (scene, time) {
//   viewer.scene.light.direction = Cesium.Cartesian3.clone(
//     viewer.scene.camera.directionWC,
//     viewer.scene.light.direction
//   );
// });

// viewer.scene.fxaa = false;
//viewer.scene.postProcessStages.fxaa.enabled = false;
// viewer.scene.requestRenderMode = true;
//viewer.scene.maximumRenderTimeChange = Infinity; // Render alleen bij veranderingen

const tileset = await Cesium.Cesium3DTileset.fromUrl(
      "tileset.json",
      { enableDebugWireframe: true }
    );
tileset.debugShowBoundingVolume = true;
// Toon de driehoeken (triangles) van de mesh als wireframe.
tileset.debugWireframe = true;

// Color per surface type, using the second EXT_mesh_features feature-id set / property table
// generated by pg2b3dm's --surfaces option (GroundSurface/RoofSurface/OuterWallSurface/InnerWallSurface).
// By default Cesium styles/picks using the FIRST feature-id set (featureId_0 = pand batch id);
// featureIdLabel selects the second, unlabeled set (featureId_1 = surface type) for styling instead.
tileset.featureIdLabel = "surfaceType";
tileset.style = new Cesium.Cesium3DTileStyle({
  color: {
    conditions: [
      ["${name} === 'GroundSurface'", "color('#8B5A2B')"],
      ["${name} === 'RoofSurface'", "color('#D2222D')"],
      ["${name} === 'OuterWallSurface'", "color('#32CD32')"],
      ["${name} === 'InnerWallSurface'", "color('#888888')"],
      ["true", "color('white')"]
    ]
  }
});
//  tileset.modelMatrix = Cesium.Matrix4.fromTranslation(new Cesium.Cartesian3(0, 0, 55));


// Pas de transformatie toe
// tileset.modelMatrix = transform;
    viewer.scene.primitives.add(tileset);
    viewer.scene.globe.depthTestAgainstTerrain = true;
    viewer.scene.globe.enableLighting = true;
    viewer.scene.highDynamicRange = true;
    viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0, -0.5, 0));

// Hover-paneel: toont de custom vertex-attributen (via EXT_mesh_features/EXT_structural_metadata)
// van de driehoek onder de muis. Cesium kan per pick maar 1 feature-id-set tegelijk lezen
// (bepaald door tileset.featureIdLabel), daarom kun je met de dropdown rechtsboven wisselen
// tussen de pand-attributen (_FEATURE_ID_0: identificatie, labels) en de surface-type-attributen
// (_FEATURE_ID_1: type, name).
const attributePanel = document.getElementById("attributePanel");
const featureIdToggle = document.getElementById("featureIdToggle");

featureIdToggle.addEventListener("change", function () {
  tileset.featureIdLabel = featureIdToggle.value || undefined;
  viewer.scene.requestRender();
});

viewer.screenSpaceEventHandler.setInputAction(function onMouseMove(movement) {
  const pickedFeature = viewer.scene.pick(movement.endPosition);

  if (!(pickedFeature instanceof Cesium.Cesium3DTileFeature || pickedFeature instanceof Cesium.ModelFeature)) {
    attributePanel.style.display = "none";
    return;
  }

  const propertyIds = pickedFeature.getPropertyIds();
  const lines = [`featureId (${featureIdToggle.value || "featureId_0"}): ${pickedFeature.featureId}`];
  for (const propertyId of propertyIds) {
    lines.push(`${propertyId}: ${pickedFeature.getProperty(propertyId)}`);
  }

  attributePanel.textContent = lines.join("\n");
  attributePanel.style.display = "block";
  attributePanel.style.left = `${movement.endPosition.x + 15}px`;
  attributePanel.style.top = `${movement.endPosition.y + 15}px`;
}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);


  </script>
</body>
</html>
