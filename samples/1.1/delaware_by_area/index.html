<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.101.0/Cesium.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.101.0/Widgets/widgets.min.css" rel="stylesheet">
  
    <style>
      html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .toolbar-left {
            display: block;
            position: absolute;
            top: 5px;
            left: 5px;
        }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzZDFhZGJhMi00OWQ2LTQzOGQtOTY2Ni04MmIxOTVjZmMwZjQiLCJpZCI6NDc4OSwiaWF0IjoxNjk4Mzk4MjM2fQ.GBw4d-IZ-VW22FnqX_fCE2zoctdf8wVnVxlpW2aOq5A';
    var viewer = new Cesium.Viewer('cesiumContainer', {
      // terrainProvider : Cesium.createWorldTerrain()
    });
    viewer.scene.debugShowFramesPerSecond = true;
    var tileset = viewer.scene.primitives.add(new Cesium.Cesium3DTileset({
        url : 'tileset.json'
    }));

    //tileset.debugShowBoundingVolume = true;
    viewer.scene.globe.enableLighting = false;
    viewer.scene.sun.show = false;
    //tileset.debugColorizeTiles = true;
    viewer.scene.globe.depthTestAgainstTerrain = true;
    viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0, -0.5, 0));
    viewer.scene.primitives.add(tileset);
    var handler = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
    handler.setInputAction(function(movement) {
      var feature = viewer.scene.pick(movement.position);
      if (!Cesium.defined(feature)) {
          return;

      }
      var propertyNames = feature.getPropertyNames();
      var length = propertyNames.length;
        for (var i = 0; i < length; ++i) {
            var propertyName = propertyNames[i];
            console.log(propertyName + ': ' + feature.getProperty(propertyName));
        }
  }, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

  </script>
</body>
</html>
